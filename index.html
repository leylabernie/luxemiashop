    <!-- Google tag (gtag.js) - GA4 + Google Ads — DEFERRED to AFTER PAGE LOAD via
         requestIdleCallback. PSI 2026-07-22: GTM (66KB) was executing during initial

         critical path. Now loads only after browser is idle, well past LCP.
         Analytics data is still collected (page_view fires after load). -->
    <script>
      // Defer GTM to idle time — does NOT block rendering or LCP
      window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}window.gtag=gtag;
      function loadGTM(){var s=document.createElement('script');s.src='https://www.googletagmanager.com/gtag/js?id=G-D1NN0TC3Y0';s.async=true;document.head.appendChild(s);gtag('js',new Date());gtag('config','G-D1NN0TC3Y0',{send_page_view:true,allow_google_signals:true,linked_domains:['luxemia.shop']});}
      if('requestIdleCallback' in window){requestIdleCallback(loadGTM,{timeout:4000});}else{window.addEventListener('load',function(){setTimeout(loadGTM,200);});}
    </script>

    <!-- Critical CSS: Reserve space for header + hero to prevent CLS.
         PSI 2026-07-22: Expanded critical CSS to cover the visible above-the-fold

         eliminates layout shifts during CSS bundle loading. -->
    <style>
      /* Base reset */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{overflow-x:hidden;max-width:100vw;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
      body{font-family:'Lora',Georgia,'Times New Roman',serif;color:#1a1a1a;background:#fff;line-height:1.6}
      #root{min-height:100vh}
      /* Font fallback sizing — match Google Fonts metrics to prevent CLS during swap */
      .font-serif,h1,h2,h3,.font-serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
      /* Prevent CLS on images */
      img{max-width:100%;height:auto;display:block}
      /* Reserve the full-bleed carousel space before the stylesheet loads. */
      main.pt-\[88px\]{padding-top:88px}
      @media(min-width:1024px){main.pt-\[88px\]{padding-top:130px}}
      [data-home-hero]{height:620px;min-height:620px;background:#0f0d0b}
      @media(min-width:641px){[data-home-hero]{height:min(78vh,720px);min-height:520px}}
      /* Ensure smooth loading without layout shifts */
      [style*="min-height"]{content-visibility:auto}
      /* Touch target sizing for mobile accessibility */
      @media(max-width:768px){button,a{min-height:44px;min-width:44px}}
      /* Prevent scrollbar flash */
      html{scroll-behavior:smooth}
      /* Background for common containers used above the fold */
      .bg-background{background-color:#fff}
      .bg-foreground{background-color:#1a1a1a}
      .text-background{color:#fff}
      .text-muted-foreground{color:#737373}
      /* Container */
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      @media(min-width:640px){.container{max-width:640px}}
      @media(min-width:1024px){.container{max-width:1280px;padding-left:2rem;padding-right:2rem}}
      /* Grid for hero carousel (desktop 2-col) */
      @media(min-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}.lg\:grid-cols-2{grid-template-columns:repeat(2,1fr)}}
      /* Flex utilities used above the fold */
      .flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}
      .overflow-hidden{overflow:hidden}.relative{position:relative}
      /* Text utilities */
      .text-center{text-align:center}.text-sm{font-size:0.875rem}.text-xs{font-size:0.75rem}
      .font-medium{font-weight:500}.font-light{font-weight:300}
      .tracking-\[0\.2em\]{letter-spacing:0.2em}.tracking-\[0\.32em\]{letter-spacing:0.32em}
      .uppercase{text-transform:uppercase}.opacity-70{opacity:0.7}
      /* Spacing */

      .gap-1\.5{gap:0.375rem}.gap-2{gap:0.5rem}
      /* Hero image panel background (creamy tone used by first slide) */
      [style*="background-color: rgb(245"]{background-color:#f5ead8}
    </style>
