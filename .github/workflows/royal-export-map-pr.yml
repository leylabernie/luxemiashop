name: Royal Export Product Image Staging

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/download_royal_export_images.py
      - .github/workflows/royal-export-map-pr.yml

permissions:
  contents: write

jobs:
  stage-approved-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verification dependencies
        run: python -m pip install --upgrade requests pillow

      - name: Download and verify approved supplier images
        run: python scripts/download_royal_export_images.py

      - name: Commit temporary image staging to the isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f royal-export-artifact
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
          else
            git commit -m "Stage verified Royal Export images for Shopify ingest"
            git push origin HEAD:${{ github.head_ref }}
          fi
