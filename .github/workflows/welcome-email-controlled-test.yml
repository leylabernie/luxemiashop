name: Controlled WELCOME10 delivery test

on:
  push:
    branches:
      - agent/catalog-conversion-integrity-20260813

permissions:
  contents: write

concurrency:
  group: welcome-email-controlled-test-20260813
  cancel-in-progress: false

jobs:
  test-and-clean-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/catalog-conversion-integrity-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Send and verify controlled welcome email
        id: welcome_test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Origin: https://luxemia.shop' \
            --header 'Content-Type: application/json' \
            --data '{"email":"luxemia.shop@gmail.com","type":"newsletter","source":"welcome_popup_10_percent"}' \
            'https://jcyolouvxfxovzjyyrxu.supabase.co/functions/v1/submit-email')"
          echo "Supabase response: ${response}"
          RESPONSE_JSON="${response}" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['RESPONSE_JSON'])
          assert payload.get('success') is True, payload
          assert payload.get('deliveryStatus') == 'accepted', payload
          assert payload.get('discountCode') == 'WELCOME10', payload
          assert payload.get('discountPercent') == 10, payload
          print('WELCOME10 response contract verified.')
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/welcome-email-controlled-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove controlled welcome-email test workflow"
          git push origin HEAD:agent/catalog-conversion-integrity-20260813
