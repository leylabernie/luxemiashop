name: Finalize catalog conversion integrity branch

on:
  push:
    branches:
      - agent/catalog-conversion-integrity-20260813

permissions:
  contents: write

concurrency:
  group: catalog-conversion-integrity-finalize-20260813
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
        with:
          ref: agent/catalog-conversion-integrity-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact sitemap inventory and remove temporary assembly files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          inventory_path = Path('scripts/approved-sitemap-inventory.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))

          additions = [
              '/product/bandhani-print-kutchi-patchwork-navratri-lehenga-choli',
              '/product/ivory-rani-pink-mirror-work-gadhwal-silk-bridal-lehenga',
              '/product/rani-pink-mirror-work-gadhwal-silk-bridal-lehenga',
          ]
          removals = {
              '/product/royal-crimson-gadhwal-silk-bridal-lehenga-choli-with-heavy-zari-work-for-wedding',
              '/product/vibrant-saffron-gadhwal-silk-bridal-lehenga-choli-for-traditional-indian-wedding-ceremony',
              '/product/radiant-rani-pink-gadhwal-silk-bridal-lehenga-choli-for-your-wedding',
              '/product/elegant-ivory-gadhwal-silk-bridal-lehenga-choli-for-wedding-celebration',
          }

          paths = [path for path in inventory['paths'] if path not in removals]
          for path in additions:
              if path not in paths:
                  paths.append(path)

          if len(paths) != 758:
              raise SystemExit(f'Expected 758 approved sitemap paths, found {len(paths)}')
          if any(path in paths for path in removals):
              raise SystemExit('A zero-stock Gadhwal product remains in the approved sitemap inventory')
          if any(path not in paths for path in additions):
              raise SystemExit('A sale-ready Headless product is missing from the approved sitemap inventory')

          inventory['source'] = '2026-08-13 catalog conversion integrity inventory'
          inventory['capturedOn'] = '2026-08-13'
          inventory['urlCount'] = 758
          inventory['paths'] = paths
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')

          generator_path = Path('scripts/generate-sitemap.cjs')
          generator = generator_path.read_text(encoding='utf-8')
          old = 'const EXPECTED_SITEMAP_URL_COUNT = 759;'
          new = 'const EXPECTED_SITEMAP_URL_COUNT = 758;'
          if old in generator:
              generator = generator.replace(old, new, 1)
          elif new not in generator:
              raise SystemExit('Could not locate the expected sitemap count constant')
          generator_path.write_text(generator, encoding='utf-8')
          PY

          rm -f .github/submit-email.ts.part-*

      - name: Install dependencies
        run: npm ci

      - name: Re-run source integrity gates
        shell: bash
        run: |
          npm run validate:blog
          npm run validate:policy-copy
          npm run validate:legacy-redirects
          npm run validate:product-schema
          npm run validate:conversion-integrity
          npm run build:dev

      - name: Commit finalized reviewed branch and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/catalog-conversion-integrity-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize catalog inventory and remove temporary files"
          git push origin HEAD:agent/catalog-conversion-integrity-20260813
