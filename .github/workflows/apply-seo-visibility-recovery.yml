name: Apply SEO visibility recovery

on:
  push:
    branches:
      - agent/seo-visibility-recovery-20260814
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-visibility-recovery-20260814
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-visibility-recovery-20260814
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply deterministic recovery patch
        run: |
          node --check scripts/apply-seo-visibility-recovery.mjs
          node scripts/apply-seo-visibility-recovery.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate recovered URLs and crawler parity
        run: npm run validate:seo-recovery

      - name: Validate restored editorial content
        run: npm run validate:blog

      - name: Run existing release safeguards
        run: |
          npm run validate:policy-copy
          npm run validate:legacy-redirects
          npm run validate:product-schema
          npm run validate:conversion-integrity

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove one-time patch files
        run: |
          rm scripts/apply-seo-visibility-recovery.mjs
          rm .github/workflows/apply-seo-visibility-recovery.yml

      - name: Commit validated recovery tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore high-intent URLs lost in July migration"
          git push origin HEAD:agent/seo-visibility-recovery-20260814
