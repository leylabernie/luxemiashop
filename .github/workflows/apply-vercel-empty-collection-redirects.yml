name: Apply Vercel empty collection redirects

on:
  push:
    branches:
      - agent/fix-vercel-empty-collection-redirects-20260827
    paths:
      - .github/workflows/apply-vercel-empty-collection-redirects.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-vercel-empty-collection-redirects-20260827
          fetch-depth: 0
          persist-credentials: true

      - name: Write redirects to Vercel routing configuration
        run: python3 .github/scripts/apply-vercel-empty-collection-redirects.py

      - name: Remove one-time patch machinery
        run: rm -f .github/scripts/apply-vercel-empty-collection-redirects.py .github/workflows/apply-vercel-empty-collection-redirects.yml

      - name: Validate deployable configuration
        run: |
          node scripts/finalize-empty-collection-redirects.cjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('[vercel] valid JSON')"
          git diff --check

      - name: Commit the controlled routing correction
        run: |
          git config user.name "LuxeMia Recovery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No routing correction was produced."
            exit 1
          fi
          git commit -m "fix: configure Vercel empty collection redirects"
          git push origin HEAD:agent/fix-vercel-empty-collection-redirects-20260827
