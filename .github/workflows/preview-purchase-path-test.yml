name: Preview desktop and mobile purchase-path test

on:
  push:
    branches:
      - agent/catalog-conversion-integrity-20260813

permissions:
  contents: write

concurrency:
  group: preview-purchase-path-test-20260813
  cancel-in-progress: false

jobs:
  verify-and-clean-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/catalog-conversion-integrity-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Install Chromium automation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium

      - name: Verify desktop and mobile product-to-checkout paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/luxemia-browser
          cat > /tmp/luxemia-browser/verify.py <<'PY'
          import json
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          BASE = "https://luxemiashop-git-agent-catalog-1cdbcb-labbhamini-7947s-projects.vercel.app"
          PRODUCT = "/product/bandhani-print-kutchi-patchwork-navratri-lehenga-choli"
          OUT = Path("/tmp/luxemia-browser")
          results = []

          def wait_network(page):
              try:
                  page.wait_for_load_state("networkidle", timeout=30_000)
              except PlaywrightTimeoutError:
                  pass

          def click_visible(locator):
              for index in range(locator.count()):
                  candidate = locator.nth(index)
                  if candidate.is_visible():
                      candidate.scroll_into_view_if_needed()
                      candidate.click(timeout=30_000)
                      return
              raise AssertionError("No visible matching control was found")

          def run_path(browser, name, viewport):
              context = browser.new_context(
                  viewport=viewport,
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/151.0.0.0 Safari/537.36"
                  ),
              )
              context.add_init_script(
                  "localStorage.setItem('luxemia_popup_seen','true');"
                  "localStorage.removeItem('shopify-cart');"
              )
              page = context.new_page()
              try:
                  response = page.goto(BASE + PRODUCT, wait_until="domcontentloaded", timeout=120_000)
                  assert response is not None and response.status < 400, f"product HTTP status: {getattr(response, 'status', None)}"
                  wait_network(page)
                  body = page.locator("body").inner_text(timeout=30_000)
                  blocked_markers = ["Vercel Security Checkpoint", "Log in to Vercel", "Deployment Protection"]
                  assert not any(marker in body for marker in blocked_markers), body[:500]

                  page.get_by_role(
                      "heading",
                      name=re.compile("Bandhani Print Kutchi Patchwork Navratri Lehenga Choli", re.I),
                  ).wait_for(state="visible", timeout=60_000)
                  page.screenshot(path=str(OUT / f"{name}-product.png"), full_page=True)

                  click_visible(page.get_by_role("button", name=re.compile("Add to Bag", re.I)))
                  page.get_by_text(re.compile(r"Your Bag \([1-9]", re.I)).wait_for(state="visible", timeout=30_000)
                  checkout = page.get_by_role("button", name=re.compile("Proceed to Checkout", re.I))
                  checkout.wait_for(state="visible", timeout=30_000)
                  page.screenshot(path=str(OUT / f"{name}-bag.png"), full_page=True)

                  checkout.click(timeout=30_000)
                  page.wait_for_url(re.compile(r"myshopify\.com"), timeout=90_000)
                  wait_network(page)
                  assert "myshopify.com" in page.url, page.url
                  checkout_text = page.locator("body").inner_text(timeout=30_000)
                  assert any(term in checkout_text.lower() for term in ["checkout", "contact", "delivery"]), checkout_text[:500]
                  page.screenshot(path=str(OUT / f"{name}-checkout.png"), full_page=True)
                  results.append({"mode": name, "product": "passed", "bag": "passed", "checkout": "passed", "checkoutHost": "myshopify.com"})
              finally:
                  context.close()

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              try:
                  run_path(browser, "desktop", {"width": 1440, "height": 900})
                  run_path(browser, "mobile", {"width": 390, "height": 844})
              finally:
                  browser.close()

          (OUT / "results.json").write_text(json.dumps(results, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(results, sort_keys=True))
          PY
          python3 /tmp/luxemia-browser/verify.py

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-purchase-path-results
          path: /tmp/luxemia-browser
          if-no-files-found: warn
          retention-days: 1

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preview-purchase-path-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove preview purchase-path test workflow"
          git push origin HEAD:agent/catalog-conversion-integrity-20260813
