name: Royal Export Navratri Source Ingest

on:
  push:
    branches:
      - agent/royal-export-navratri-source-ingest-20260823
    paths:
      - .github/workflows/royal-export-navratri-scrape.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml pillow

      - name: Fetch source pages and product media
        shell: bash
        run: |
          cat > /tmp/scrape_royal_export.py <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          PRODUCT_URLS = [
              "https://www.royalexport.in/product/gamthi-work-pure-cotton-navratri-lehenga-choli-1580",
              "https://www.royalexport.in/product/navratri-special-pink-color-pure-rayon-lehenga-cho-3688",
              "https://www.royalexport.in/product/traditonal-red-gamthi-work-cotton-navratri-wear-le-2326",
              "https://www.royalexport.in/product/digital-printed-lehenga-choli-with-kutchi-mirror-l-2634",
              "https://www.royalexport.in/product/traditional-navratri-cotton-lehenga-choli-with-fla-9805",
              "https://www.royalexport.in/product/opulent-blue-designer-cora-cotton-lehenga-with-ban-18742",
              "https://www.royalexport.in/product/lime-and-white-pure-cotton-mirror-work-and-gota-pa-1490",
              "https://www.royalexport.in/product/red-mirror-work-navratri-wear-lehenga-choli-with-d-6397",
              "https://www.royalexport.in/product/navratri-special-heavy-muslin-cotton-lehenga-choli-4079",
              "https://www.royalexport.in/product/navratri-special-butter-silk-printed-mirror-work-l-1137",
              "https://www.royalexport.in/product/soft-butter-silk-with-real-mirror-work-lehenga-cho-3425",
              "https://www.royalexport.in/product/black-real-mirror-gota-patti-work-silk-lehenga-cho-667",
              "https://www.royalexport.in/product/bandhani-print-navratri-chaniya-choli-3267",
              "https://www.royalexport.in/product/soft-gaji-silk-printed-with-zari-border-lehenga-ch-3663",
              "https://www.royalexport.in/product/remarkable-black-heavy-flare-cotton-lehenga-with-s-13785",
              "https://www.royalexport.in/product/black-maroon-reyon-printed-lehenga-choli-with-kodi-2130",
          ]

          OUT = Path("royal-export-artifact")
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / "raw-html").mkdir(exist_ok=True)
          (OUT / "products").mkdir(exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=4,
              connect=4,
              read=4,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET"],
          )
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "Referer": "https://www.royalexport.in/navratri-lehnega-choli",
          })

          SKIP_TOKENS = {
              "logo", "icon", "favicon", "payment", "visa", "master", "rupay",
              "whatsapp", "facebook", "instagram", "youtube", "twitter", "loader",
              "placeholder", "size-chart", "size_chart", "flag", "banner", "review",
              "sprite", "watermark", "no-image", "user", "avatar", "footer",
          }

          def norm_space(value: str) -> str:
              return re.sub(r"\s+", " ", value or "").strip()

          def slug_from_url(url: str) -> str:
              return urlparse(url).path.rstrip("/").split("/")[-1]

          def collect_json_images(obj, output: list[str]):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key.lower() in {"image", "images", "contenturl", "thumbnailurl"}:
                          if isinstance(value, str):
                              output.append(value)
                          elif isinstance(value, list):
                              output.extend(x for x in value if isinstance(x, str))
                          elif isinstance(value, dict):
                              for nested in value.values():
                                  if isinstance(nested, str):
                                      output.append(nested)
                      collect_json_images(value, output)
              elif isinstance(obj, list):
                  for value in obj:
                      collect_json_images(value, output)

          def candidate_images(soup: BeautifulSoup, base_url: str) -> list[dict]:
              found: list[dict] = []

              def add(raw: str | None, origin: str, alt: str = ""):
                  if not raw:
                      return
                  raw = raw.strip().strip('"\'')
                  if not raw or raw.startswith("data:"):
                      return
                  if "," in raw and (" " in raw or raw.count("http") > 1):
                      # srcset: keep each URL token.
                      for part in raw.split(","):
                          add(part.strip().split(" ")[0], origin + ":srcset", alt)
                      return
                  url = urljoin(base_url, raw)
                  parsed = urlparse(url)
                  if parsed.scheme not in {"http", "https"}:
                      return
                  low = url.lower()
                  if any(token in low for token in SKIP_TOKENS):
                      return
                  found.append({"url": url, "origin": origin, "alt": norm_space(alt)})

              for prop in ["og:image", "og:image:secure_url", "twitter:image"]:
                  for tag in soup.select(f'meta[property="{prop}"], meta[name="{prop}"]'):
                      add(tag.get("content"), f"meta:{prop}")

              for script in soup.select('script[type="application/ld+json"]'):
                  try:
                      data = json.loads(script.string or script.get_text(" ", strip=True))
                  except Exception:
                      continue
                  vals: list[str] = []
                  collect_json_images(data, vals)
                  for value in vals:
                      add(value, "jsonld")

              attrs = [
                  "src", "data-src", "data-lazy-src", "data-original", "data-image",
                  "data-zoom-image", "data-large_image", "data-large-image", "data-thumb",
                  "srcset", "data-srcset",
              ]
              for img in soup.find_all("img"):
                  alt = img.get("alt") or img.get("title") or ""
                  for attr in attrs:
                      add(img.get(attr), f"img:{attr}", alt)

              for anchor in soup.find_all("a"):
                  href = anchor.get("href")
                  if href and re.search(r"\.(?:jpe?g|png|webp|avif)(?:\?|$)", href, re.I):
                      add(href, "anchor", anchor.get("title") or anchor.get_text(" ", strip=True))

              # Preserve first occurrence while merging origin/alt evidence.
              merged: dict[str, dict] = {}
              for row in found:
                  url = row["url"]
                  if url not in merged:
                      merged[url] = row
                  else:
                      if row["origin"] not in merged[url]["origin"]:
                          merged[url]["origin"] += "," + row["origin"]
                      if not merged[url]["alt"] and row["alt"]:
                          merged[url]["alt"] = row["alt"]
              return list(merged.values())

          def product_details(soup: BeautifulSoup) -> str:
              heading = None
              for tag in soup.find_all(["h2", "h3", "h4", "a"]):
                  if "product details" in norm_space(tag.get_text(" ", strip=True)).lower():
                      heading = tag
                      break
              if not heading:
                  return ""
              parts: list[str] = []
              node = heading
              for _ in range(80):
                  node = node.find_next()
                  if not node:
                      break
                  text = norm_space(node.get_text(" ", strip=True))
                  if not text:
                      continue
                  low = text.lower()
                  if any(stop in low for stop in ["customer reviews", "related products", "write a review", "how would you rate"]):
                      break
                  if node.name in {"p", "li", "h5", "h6", "div"} and len(text) <= 800:
                      if text not in parts and not any(text in old for old in parts):
                          parts.append(text)
              return "\n".join(parts[:50])

          def download_candidate(product_dir: Path, item: dict, index: int) -> dict:
              url = item["url"]
              try:
                  response = session.get(url, timeout=60, headers={"Referer": item.get("page_url", "https://www.royalexport.in/")})
                  response.raise_for_status()
                  content_type = response.headers.get("content-type", "").lower()
                  if "image" not in content_type and not re.search(r"\.(?:jpe?g|png|webp|avif)(?:\?|$)", url, re.I):
                      return {**item, "downloaded": False, "error": f"not image: {content_type}"}
                  payload = response.content
                  if len(payload) < 15000:
                      return {**item, "downloaded": False, "error": f"too small: {len(payload)}"}
                  with Image.open(io.BytesIO(payload)) as img:
                      width, height = img.size
                      fmt = (img.format or "JPEG").upper()
                      if max(width, height) < 500 or min(width, height) < 250:
                          return {**item, "downloaded": False, "error": f"small dimensions: {width}x{height}"}
                      ext = {"JPEG": ".jpg", "JPG": ".jpg", "PNG": ".png", "WEBP": ".webp", "AVIF": ".avif"}.get(fmt, ".jpg")
                      digest = hashlib.sha1(url.encode("utf-8")).hexdigest()[:8]
                      filename = f"{index:02d}-{digest}{ext}"
                      path = product_dir / filename
                      path.write_bytes(payload)
                      return {
                          **item,
                          "downloaded": True,
                          "filename": filename,
                          "bytes": len(payload),
                          "width": width,
                          "height": height,
                          "format": fmt,
                      }
              except Exception as exc:
                  return {**item, "downloaded": False, "error": repr(exc)}

          records: list[dict] = []
          for number, url in enumerate(PRODUCT_URLS, start=1):
              slug = slug_from_url(url)
              print(f"[{number}/{len(PRODUCT_URLS)}] Fetching {url}")
              response = session.get(url, timeout=60)
              status = response.status_code
              html = response.text
              (OUT / "raw-html" / f"{slug}.html").write_text(html, encoding="utf-8", errors="replace")
              soup = BeautifulSoup(html, "lxml")
              text = norm_space(soup.get_text(" ", strip=True))
              h1 = soup.find("h1")
              title = norm_space(h1.get_text(" ", strip=True)) if h1 else ""
              sku_match = re.search(r"SKU\s*:\s*([A-Za-z0-9][A-Za-z0-9 _-]{1,40}?)(?=\s+(?:In Stock|Availability|Size Chart|Variant|Add to cart|$))", text, re.I)
              price_match = re.search(r"(?:^|\s)(\d[\d,]{2,})\s*/\s*Pcs", text, re.I)
              compare_match = re.search(r"\d[\d,]{2,}\s*/\s*Pcs\s+(\d[\d,]{2,})", text, re.I)
              sku = norm_space(sku_match.group(1)) if sku_match else ""
              price_inr = int(price_match.group(1).replace(",", "")) if price_match else None
              compare_at_inr = int(compare_match.group(1).replace(",", "")) if compare_match else None
              in_stock = bool(re.search(r"\bIn Stock\b", text, re.I))
              details = product_details(soup)

              safe_name = re.sub(r"[^A-Za-z0-9._-]+", "-", sku or slug).strip("-")[:100]
              product_dir = OUT / "products" / safe_name
              product_dir.mkdir(parents=True, exist_ok=True)

              candidates = candidate_images(soup, url)
              downloaded: list[dict] = []
              for idx, item in enumerate(candidates[:80], start=1):
                  item["page_url"] = url
                  row = download_candidate(product_dir, item, idx)
                  downloaded.append(row)
                  if sum(1 for x in downloaded if x.get("downloaded")) >= 20:
                      break

              record = {
                  "source_url": url,
                  "http_status": status,
                  "title": title,
                  "sku": sku,
                  "price_inr": price_inr,
                  "compare_at_inr": compare_at_inr,
                  "in_stock": in_stock,
                  "details": details,
                  "page_text_excerpt": text[:5000],
                  "product_dir": f"products/{safe_name}",
                  "image_candidates": downloaded,
              }
              (product_dir / "manifest.json").write_text(json.dumps(record, indent=2, ensure_ascii=False), encoding="utf-8")
              records.append(record)
              time.sleep(0.5)

          (OUT / "products.json").write_text(json.dumps(records, indent=2, ensure_ascii=False), encoding="utf-8")

          # Build a compact contact sheet of every successfully downloaded image.
          tiles: list[tuple[Image.Image, str]] = []
          for record in records:
              product_dir = OUT / record["product_dir"]
              for item in record["image_candidates"]:
                  if not item.get("downloaded"):
                      continue
                  path = product_dir / item["filename"]
                  try:
                      img = Image.open(path).convert("RGB")
                  except Exception:
                      continue
                  img.thumbnail((260, 320))
                  canvas = Image.new("RGB", (280, 380), "white")
                  canvas.paste(img, ((280 - img.width) // 2, 8))
                  label = f"{record['sku'] or product_dir.name}\n{item['filename']}\n{item['width']}x{item['height']}\n{item['origin']}"
                  draw = ImageDraw.Draw(canvas)
                  draw.multiline_text((8, 330), label[:140], fill="black", spacing=2)
                  tiles.append((canvas, label))

          if tiles:
              cols = 4
              rows = (len(tiles) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * 280, rows * 380), "#dddddd")
              for idx, (tile, _) in enumerate(tiles):
                  sheet.paste(tile, ((idx % cols) * 280, (idx // cols) * 380))
              sheet.save(OUT / "contact-sheet.jpg", quality=88, optimize=True)

          print(json.dumps({
              "products": len(records),
              "http_ok": sum(1 for r in records if r["http_status"] == 200),
              "products_with_images": sum(1 for r in records if any(i.get("downloaded") for i in r["image_candidates"])),
              "downloaded_images": sum(sum(1 for i in r["image_candidates"] if i.get("downloaded")) for r in records),
          }, indent=2))
          PY
          python /tmp/scrape_royal_export.py

      - name: Upload source-ingest artifact
        uses: actions/upload-artifact@v4
        with:
          name: royal-export-navratri-source-ingest
          path: royal-export-artifact
          if-no-files-found: error
          retention-days: 3
