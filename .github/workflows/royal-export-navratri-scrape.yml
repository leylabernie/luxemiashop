name: Royal Export Navratri Source Ingest

on:
  push:
    branches:
      - agent/royal-export-navratri-source-ingest-20260823
    paths:
      - .github/workflows/royal-export-navratri-scrape.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/royal-export-navratri-source-ingest-20260823

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-ingest dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml pillow

      - name: Fetch source pages and product photography
        shell: bash
        run: |
          cat > /tmp/royal_export_ingest.py <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import shutil
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          PRODUCTS = [
              "https://www.royalexport.in/product/gamthi-work-pure-cotton-navratri-lehenga-choli-1580",
              "https://www.royalexport.in/product/navratri-special-pink-color-pure-rayon-lehenga-cho-3688",
              "https://www.royalexport.in/product/traditonal-red-gamthi-work-cotton-navratri-wear-le-2326",
              "https://www.royalexport.in/product/digital-printed-lehenga-choli-with-kutchi-mirror-l-2634",
              "https://www.royalexport.in/product/traditional-navratri-cotton-lehenga-choli-with-fla-9805",
              "https://www.royalexport.in/product/opulent-blue-designer-cora-cotton-lehenga-with-ban-18742",
              "https://www.royalexport.in/product/lime-and-white-pure-cotton-mirror-work-and-gota-pa-1490",
              "https://www.royalexport.in/product/red-mirror-work-navratri-wear-lehenga-choli-with-d-6397",
              "https://www.royalexport.in/product/navratri-special-heavy-muslin-cotton-lehenga-choli-4079",
              "https://www.royalexport.in/product/navratri-special-butter-silk-printed-mirror-work-l-1137",
              "https://www.royalexport.in/product/soft-butter-silk-with-real-mirror-work-lehenga-cho-3425",
              "https://www.royalexport.in/product/black-real-mirror-gota-patti-work-silk-lehenga-cho-667",
              "https://www.royalexport.in/product/bandhani-print-navratri-chaniya-choli-3267",
              "https://www.royalexport.in/product/soft-gaji-silk-printed-with-zari-border-lehenga-ch-3663",
              "https://www.royalexport.in/product/remarkable-black-heavy-flare-cotton-lehenga-with-s-13785",
              "https://www.royalexport.in/product/black-maroon-reyon-printed-lehenga-choli-with-kodi-2130",
          ]

          out = Path("royal-export-artifact")
          if out.exists():
              shutil.rmtree(out)
          (out / "products").mkdir(parents=True)

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.25,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=["GET"],
          )
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.royalexport.in/navratri-lehnega-choli",
          })

          def clean(value: str | None) -> str:
              return re.sub(r"\s+", " ", value or "").strip()

          def slug(url: str) -> str:
              return urlparse(url).path.rstrip("/").split("/")[-1]

          def add_candidate(rows: list[dict], seen: set[str], page_url: str, raw: str | None, origin: str, alt: str = "") -> None:
              if not raw:
                  return
              raw = raw.strip().strip("\"'")
              if not raw or raw.startswith("data:"):
                  return
              if "," in raw and " " in raw:
                  for part in raw.split(","):
                      add_candidate(rows, seen, page_url, part.strip().split(" ")[0], origin + ":srcset", alt)
                  return
              url = urljoin(page_url, raw)
              if url in seen or urlparse(url).scheme not in {"http", "https"}:
                  return
              low = url.lower()
              blocked = (
                  "logo", "favicon", "icon", "payment", "whatsapp", "facebook",
                  "instagram", "youtube", "twitter", "placeholder", "loader",
                  "size-chart", "size_chart", "review", "avatar", "flag", "sprite",
              )
              if any(token in low for token in blocked):
                  return
              seen.add(url)
              rows.append({"url": url, "origin": origin, "alt": clean(alt)})

          def image_candidates(soup: BeautifulSoup, page_url: str) -> list[dict]:
              rows: list[dict] = []
              seen: set[str] = set()
              for key in ("og:image", "og:image:secure_url", "twitter:image"):
                  for tag in soup.select(f'meta[property="{key}"], meta[name="{key}"]'):
                      add_candidate(rows, seen, page_url, tag.get("content"), f"meta:{key}")
              for script in soup.select('script[type="application/ld+json"]'):
                  try:
                      obj = json.loads(script.string or script.get_text(" ", strip=True))
                  except Exception:
                      continue
                  stack = [obj]
                  while stack:
                      item = stack.pop()
                      if isinstance(item, dict):
                          for key, value in item.items():
                              if key.lower() in {"image", "images", "contenturl", "thumbnailurl"}:
                                  if isinstance(value, str):
                                      add_candidate(rows, seen, page_url, value, "jsonld")
                                  elif isinstance(value, list):
                                      for nested in value:
                                          if isinstance(nested, str):
                                              add_candidate(rows, seen, page_url, nested, "jsonld")
                              stack.append(value)
                      elif isinstance(item, list):
                          stack.extend(item)
              attrs = (
                  "src", "data-src", "data-lazy-src", "data-original", "data-image",
                  "data-zoom-image", "data-large_image", "data-large-image", "data-thumb",
                  "srcset", "data-srcset",
              )
              for tag in soup.find_all("img"):
                  alt = tag.get("alt") or tag.get("title") or ""
                  for attr in attrs:
                      add_candidate(rows, seen, page_url, tag.get(attr), f"img:{attr}", alt)
              return rows

          def parse_details(text: str) -> dict:
              sku = ""
              sku_match = re.search(r"SKU\s*:\s*([A-Za-z0-9][A-Za-z0-9_-]{1,30})", text, re.I)
              if sku_match:
                  sku = sku_match.group(1).strip()
              price = None
              price_match = re.search(r"(?:₹|Rs\.?\s*)?([0-9][0-9,]{2,})\s*/\s*Pcs", text, re.I)
              if price_match:
                  price = int(price_match.group(1).replace(",", ""))
              return {
                  "sku": sku,
                  "price_inr": price,
                  "in_stock": bool(re.search(r"\bIn Stock\b", text, re.I)),
              }

          records: list[dict] = []
          for position, page_url in enumerate(PRODUCTS, start=1):
              print(f"[{position:02d}/{len(PRODUCTS)}] {page_url}")
              response = session.get(page_url, timeout=75)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "lxml")
              text = clean(soup.get_text(" ", strip=True))
              h1 = soup.find("h1")
              title = clean(h1.get_text(" ", strip=True)) if h1 else ""
              parsed = parse_details(text)
              folder_name = parsed["sku"] or slug(page_url)
              folder_name = re.sub(r"[^A-Za-z0-9._-]+", "-", folder_name).strip("-")
              product_dir = out / "products" / folder_name
              product_dir.mkdir(parents=True)

              downloaded: list[dict] = []
              for index, candidate in enumerate(image_candidates(soup, page_url), start=1):
                  if len([row for row in downloaded if row.get("downloaded")]) >= 12:
                      break
                  try:
                      image_response = session.get(candidate["url"], timeout=75, headers={"Referer": page_url})
                      image_response.raise_for_status()
                      payload = image_response.content
                      if len(payload) < 18000:
                          continue
                      with Image.open(io.BytesIO(payload)) as image:
                          width, height = image.size
                          image_format = (image.format or "JPEG").upper()
                      if max(width, height) < 650 or min(width, height) < 300:
                          continue
                      extension = {"JPEG": ".jpg", "JPG": ".jpg", "PNG": ".png", "WEBP": ".webp", "AVIF": ".avif"}.get(image_format, ".jpg")
                      digest = hashlib.sha1(candidate["url"].encode("utf-8")).hexdigest()[:10]
                      filename = f"{index:02d}-{digest}{extension}"
                      (product_dir / filename).write_bytes(payload)
                      downloaded.append({
                          **candidate,
                          "downloaded": True,
                          "filename": filename,
                          "width": width,
                          "height": height,
                          "bytes": len(payload),
                      })
                  except Exception as exc:
                      downloaded.append({**candidate, "downloaded": False, "error": repr(exc)})

              record = {
                  "source_url": page_url,
                  "http_status": response.status_code,
                  "title": title,
                  **parsed,
                  "page_text": text,
                  "product_dir": f"products/{folder_name}",
                  "images": downloaded,
              }
              (product_dir / "manifest.json").write_text(json.dumps(record, indent=2, ensure_ascii=False), encoding="utf-8")
              records.append(record)
              time.sleep(0.5)

          (out / "products.json").write_text(json.dumps(records, indent=2, ensure_ascii=False), encoding="utf-8")
          (out / "README.md").write_text(
              "Temporary source-verification artifact. Product facts and images were fetched from the explicitly approved Royal Export product pages. Upload selected images to Shopify CDN before publication.\n",
              encoding="utf-8",
          )
          summary = {
              "products": len(records),
              "http_ok": sum(1 for row in records if row["http_status"] == 200),
              "in_stock": sum(1 for row in records if row["in_stock"]),
              "products_with_images": sum(1 for row in records if any(img.get("downloaded") for img in row["images"])),
              "images": sum(sum(1 for img in row["images"] if img.get("downloaded")) for row in records),
          }
          print(json.dumps(summary, indent=2))
          PY
          python /tmp/royal_export_ingest.py

      - name: Commit the temporary source-verification artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f royal-export-artifact
          if git diff --cached --quiet; then
            echo "No source artifact changes to commit."
          else
            git commit -m "Record Royal Export Navratri source verification"
            git push origin HEAD:agent/royal-export-navratri-source-ingest-20260823
          fi
